name: Release packages

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      bootstrap_missing_packages:
        description: Publish packages that do not exist yet using the one-time Infisical credential
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: auth-package-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.head.ref, 'release/v')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - name: Check out merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @santi020k/auth-website exec playwright install --with-deps chromium
      - run: pnpm verify

      - name: Load one-time npm bootstrap credential from Infisical
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_missing_packages }}
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /github/release-package

      - name: Validate, publish, verify, and tag every package in dependency order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "${{ inputs.bootstrap_missing_packages }}" == "true" ]]; then
            if [[ -z "${NPM_BOOTSTRAP_TOKEN:-}" ]]; then
              echo "::error::The Infisical NPM_BOOTSTRAP_TOKEN is required for initial publication."
              exit 1
            fi
            node scripts/release/publish.mjs --bootstrap-missing
          else
            node scripts/release/publish.mjs
          fi

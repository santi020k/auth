# cspell:words tlsv
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    name: Package compatibility · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.3, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:compat

  repository:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_CI_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan repository checks
        id: scope
        run: pnpm run ci:plan
      - run: pnpm --filter @santi020k/auth-website exec playwright install --with-deps chromium
        if: steps.scope.outputs.browser == 'true'
      - name: Run Quality
        uses: santi020k/quality@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          version: v2.0.0
          changed-only: false
          fail-level: warning
          report-level: warning
      - name: Upload Quality SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' && hashFiles('quality.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: quality.sarif
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
            apps/website/playwright-report
            apps/website/test-results
          if-no-files-found: ignore
          retention-days: 7

  impact-plan:
    name: Quality v2 shadow plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Quality v2
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh \
            --output "$RUNNER_TEMP/install-quality.sh"
          QUALITY_INSTALL_DIR="$RUNNER_TEMP/quality-bin" sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality v2.0.0
          echo "$RUNNER_TEMP/quality-bin" >> "$GITHUB_PATH"
      - name: Test the committed impact policy
        run: node --test scripts/quality-impact.test.mjs
      - name: Record shadow plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REF" != release/* && "$HEAD_REF" != changeset-release/* && -n "$BASE_SHA" ]]; then
            quality impact plan --base "$BASE_SHA" --head HEAD --comparison merge-base --format json > "$RUNNER_TEMP/quality-impact-plan.json"
          else
            quality impact plan --full --format json > "$RUNNER_TEMP/quality-impact-plan.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-impact-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-impact-plan.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Quality and verification
    if: always()
    needs: [repository, runtime-compatibility, impact-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to succeed
        env:
          REPOSITORY: ${{ needs.repository.result }}
          COMPATIBILITY: ${{ needs.runtime-compatibility.result }}
          IMPACT: ${{ needs.impact-plan.result }}
        run: |
          for result in "$REPOSITORY" "$COMPATIBILITY" "$IMPACT"; do
            if [[ "$result" != success ]]; then
              echo '::error::A required validation job failed, was cancelled, or was skipped.'
              exit 1
            fi
          done

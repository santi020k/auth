name: Deploy website

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: auth-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://auth.santi020k.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @santi020k/auth-website exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Load production deployment secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /github/deploy-website
      - name: Deploy static website
        run: pnpm --filter @santi020k/auth-website run deploy
      - name: Verify production
        run: curl --fail --retry 6 --retry-delay 10 --retry-all-errors https://auth.santi020k.com/

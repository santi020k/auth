# yaml-language-server: $schema=https://quality.santi020k.com/quality.schema.json
version: 1
output: pretty
baseline: .quality-baseline.json
tools:
  astro-check:
    enabled: true
    check: false
    required: true
  cspell:
    enabled: true
    check: false
    required: true
  eslint:
    enabled: true
    check: false
    required: true
  knip:
    enabled: true
    check: false
    required: true
  prettier:
    enabled: true
    check: false
    required: true
  santi-og:
    enabled: true
    check: false
    required: true
tasks:
  repository-check:
    name: Repository verification
    command: pnpm
    args: [run, verify]
    required: true
    parser: generic
hooks:
  commit-msg:
    steps:
      - name: Validate commit message
        command: pnpm
        args: [exec, commitprompt, validate, --input]
        pass_hook_args: true
  pre-commit:
    steps:
      - name: Check staged files
        command: pnpm
        args: [run, pre-commit]
  pre-push:
    steps:
      - name: Run repository verification
        command: pnpm
        args: [run, pre-push]
